
services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "80:80"
    networks:
      - appnet
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-app
    ports:
      - "84:80"
    environment:
      DB_HOST: "database-1.cs5euy4m6tvk.us-east-1.rds.amazonaws.com"
      DB_USER: "admin"
      DB_PASSWORD: "Megha2001"
      DB_PORT: "3306"
      DB_NAME: "booksapp"
      APP_PORT: "80"
      NODE_ENV: "development"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "7d"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
